const bF=$('bFire');bF.addEventListener('pointerdown',e=>{e.stopPropagation();fire=true;});bF.addEventListener('pointerup',()=>fire=false);bF.addEventListener('pointerleave',()=>fire=false);
$('bStart').onclick=startWave;$('bAir').onclick=strike;$('sJeep').onclick=()=>buy('jeep');$('sBike').onclick=()=>buy('bike');$('sTank').onclick=()=>buy('tank');$('bNade').onclick=nade;$('bJeep').onclick=tJeep;
function startWave(){if(S.mode!=='build')return;S.wave++;S.mode='fight';spawnLeft=8+S.wave*6;spawnT=0;msg('גל '+S.wave);setTimeout(()=>{if(S.mode==='fight')msg('')},2000);}
function turret(){if(S.coins<50||Math.hypot(aim.x,aim.z)<5||Math.abs(aim.x)>AX||Math.abs(aim.z)>AZ)return;S.coins-=50;const m=turretM();m.position.set(aim.x,0,aim.z);sc.add(m);turrets.push({m,x:aim.x,z:aim.z,cd:0});}
function tJeep(){if(inJeep){inJeep=false;jeep.x=p.x;jeep.z=p.z;}else if(jeep.alive&&Math.hypot(jeep.x-p.x,jeep.z-p.z)<6)inJeep=true;}
function blast(x,z,r,d,big){if(r>=3&&dec.length<40){const c=new THREE.Mesh(new THREE.CircleGeometry(r*.5,16),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.5,depthWrite:false}));c.rotation.x=-Math.PI/2;c.position.set(x,.03,z);sc.add(c);dec.push(c);}if(d)for(const e of enemies)if(Math.hypot(e.x-x,e.z-z)<r)e.hp-=d;
for(let i=0;i<7;i++)puff(x+(rnd()-.5)*r*.3,1+rnd(),z+(rnd()-.5)*r*.3,(rnd()-.5)*5,rnd()*3,(rnd()-.5)*5,.55,r*.55,0xff8a22,true,1);
for(let i=0;i<6;i++)puff(x,1,z,(rnd()-.5)*3,2+rnd()*2,(rnd()-.5)*3,1.6,r*.7,0x2a2a2c,false,.7);
for(let i=0;i<9;i++)puff(x,1,z,(rnd()-.5)*22,rnd()*9,(rnd()-.5)*22,.45,.5,0xffdd88,true,1);
fl.position.set(x,3,z);fl.intensity=big?7:3;shake=Math.max(shake,big?.9:.3);}
function nade(){if(S.nades>0&&S.mode==='fight'){S.nades--;const t=nearest(p.x,p.z,1e9);const tx=mouseUsed?aim.x:(t?t.x:p.x),tz=mouseUsed?aim.z:(t?t.z:p.z);const m=new THREE.Mesh(new THREE.SphereGeometry(.35,10,8),std(0x2d3a2a,.5,.5));m.position.set(tx,.4,tz);sc.add(sh(m));nades.push({m,x:tx,z:tz,t:.7});}}
function nearest(x,z,mx){let b=null,bd=mx;for(const e of enemies){const d=Math.hypot(e.x-x,e.z-z);if(d<bd){bd=d;b=e;}}return b;}
function spawn(){const s=rnd()*4|0,t=rnd()*2-1;const x=s<2?t*AX:(s==2?-AX:AX),z=s==0?-AZ:s==1?AZ:t*AZ;const tk=S.wave>=2&&rnd()<.2;const m=tk?tank():human(0x5a5a3a,0x3b3b2a);m.position.set(x,0,z);sc.add(m);enemies.push({m,x,z,hp:tk?250:30,sp:(tk?5:8)+S.wave*.3,r:tk?2:.9,tank:tk,ph:rnd()*6,fc:1+rnd()*2});}
function tracer(x,z,aa,d,l,col,sp,arr){arr=arr||bullets;const m=new THREE.Mesh(new THREE.BoxGeometry(1.8,.07,.07),new THREE.MeshBasicMaterial({color:col,blending:THREE.AdditiveBlending,transparent:true}));m.position.set(x,1.3,z);m.rotation.y=-aa;sc.add(m);arr.push({m,vx:Math.cos(aa)*sp,vz:Math.sin(aa)*sp,d,l});}
const clk=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(.033,clk.getDelta());T+=dt;update(dt);if(comp){comp.fin.uniforms.t.value=T%10;comp.render(dt);}else R.render(sc,cam);}
function update(dt){let a=0,moving=false;
if(S.mode!=='over'){
let dx=(keys.d?1:0)-(keys.a?1:0)+jv.x,dz=(keys.s?1:0)-(keys.w?1:0)+jv.z;const l=Math.hypot(dx,dz);
if(l>.01){moving=true;const k=Math.min(1,l)/l,sp=inJeep?V[jeep.type].sp:12;p.x=Math.max(-AX,Math.min(AX,p.x+dx*k*sp*dt));p.z=Math.max(-AZ,Math.min(AZ,p.z+dz*k*sp*dt));if(inJeep&&rnd()<.5)puff(p.x-dx/l*1.8,.3,p.z-dz/l*1.8,0,.8,0,.7,1.4,0x6a5a4a,false,.35);}
if(inJeep){jeep.x=p.x;jeep.z=p.z;}
let tx,tz;const nt=nearest(p.x,p.z,1e9);if(mouseUsed){tx=aim.x;tz=aim.z;}else if(nt){tx=nt.x;tz=nt.z;}else{tx=p.x+1;tz=p.z;}
a=Math.atan2(tz-p.z,tx-p.x);
cd-=dt;if(fire&&cd<=0&&S.mode==='fight'){const VS=inJeep?V[jeep.type]:null;cd=VS?VS.cd:.11;const aa=a+(rnd()-.5)*.08,gx=p.x+Math.cos(aa)*1.3,gz=p.z+Math.sin(aa)*1.3;const tk=VS&&jeep.type==='tank';tracer(gx,gz,aa,VS?VS.d:11,.9,tk?0xff9933:0xffe08a,tk?55:75);if(tk){bullets[bullets.length-1].spl=1;shake=Math.max(shake,.35);}mf.position.set(gx,1.4,gz);mf.intensity=3;puff(gx,1.3,gz,0,0,0,.06,.9,0xffd070,true,1);shake=Math.max(shake,.08);}
if(S.mode==='fight'&&spawnLeft>0){spawnT-=dt;if(spawnT<=0){spawn();spawnLeft--;spawnT=Math.max(.18,.8-S.wave*.05);}}
for(const b of bullets){b.m.position.x+=b.vx*dt;b.m.position.z+=b.vz*dt;b.l-=dt;for(const e of enemies)if(b.l>0&&Math.hypot(e.x-b.m.position.x,e.z-b.m.position.z)<e.r+.3){e.hp-=b.d;b.l=0;puff(b.m.position.x,1.2,b.m.position.z,0,1,0,.25,.8,0xffcc66,true,.9);if(b.spl)blast(b.m.position.x,b.m.position.z,5,40);}}
bullets=bullets.filter(b=>{if(b.l<=0){sc.remove(b.m);return false;}return true;});
for(const b of eb){b.m.position.x+=b.vx*dt;b.m.position.z+=b.vz*dt;b.l-=dt;const bx=b.m.position.x,bz=b.m.position.z;
if(Math.hypot(bx-p.x,bz-p.z)<(inJeep?1.8:.8)){b.l=0;if(inJeep){jeep.hp-=b.d*.5*V[jeep.type].dm;if(jeep.hp<=0){jeep.alive=false;inJeep=false;blast(p.x,p.z,6,0,true);}}else p.hp-=b.d;puff(bx,1.2,bz,0,1,0,.25,.8,0xff6644,true,.9);shake=Math.max(shake,.2);}
else if(Math.hypot(bx,bz)<3.2){b.l=0;S.base-=b.d*.4;puff(bx,1.5,bz,0,1,0,.3,1,0xffaa66,true,.9);}}
eb=eb.filter(b=>{if(b.l<=0){sc.remove(b.m);return false;}return true;});
for(const n of nades){n.t-=dt;if(n.t<=0){blast(n.x,n.z,9,130,true);sc.remove(n.m);}}nades=nades.filter(n=>n.t>0);
for(const q of turrets){q.cd-=dt;const e=nearest(q.x,q.z,24);if(e){const aa=Math.atan2(e.z-q.z,e.x-q.x);q.m.h.rotation.y=-aa;if(q.cd<=0){q.cd=.35;tracer(q.x+Math.cos(aa),q.z+Math.sin(aa),aa,13,.45,0xffbb44,60);}}}
for(const e of enemies){const aa=Math.atan2(-e.z,-e.x),dB=Math.hypot(e.x,e.z);const stop=dB<(e.tank?13:9);if(!stop){e.x+=Math.cos(aa)*e.sp*dt;e.z+=Math.sin(aa)*e.sp*dt;}
e.fc-=dt;if(e.fc<=0){const dP0=Math.hypot(p.x-e.x,p.z-e.z);let tx=null,tz=null;if(dP0<22){tx=p.x;tz=p.z;}else if(dB<24){tx=0;tz=0;}
if(tx!==null){const sa=Math.atan2(tz-e.z,tx-e.x)+(rnd()-.5)*.14;tracer(e.x+Math.cos(sa)*(e.tank?2.4:1.1),e.z+Math.sin(sa)*(e.tank?2.4:1.1),sa,e.tank?20:7,1.6,0xff4433,e.tank?32:38,eb);e.fc=e.tank?2.2:1+rnd()*.7;}else e.fc=.3;}e.m.position.x=e.x;e.m.position.z=e.z;e.m.rotation.y=-aa;
if(e.m.lL){const s=Math.sin(T*e.sp*.9+e.ph)*.6;e.m.lL.rotation.z=s;e.m.lR.rotation.z=-s;}
if(Math.hypot(e.x,e.z)<4)S.base-=(e.tank?14:5)*dt;
const d=Math.hypot(e.x-p.x,e.z-p.z);
if(inJeep&&d<e.r+1.8){const VR=V[jeep.type];e.hp-=(e.tank?40:100)*VR.ram;jeep.hp-=(e.tank?25:2)*VR.dm;blast(e.x,e.z,2,0);if(jeep.hp<=0){jeep.alive=false;inJeep=false;blast(p.x,p.z,6,0,true);}}
else if(!inJeep&&d<e.r+.9)p.hp-=(e.tank?30:12)*dt;}
for(const e of enemies)if(e.hp<=0){S.coins+=e.tank?40:8;if(e.tank)blast(e.x,e.z,4,0,true);else for(let i=0;i<4;i++)puff(e.x,.5,e.z,(rnd()-.5)*2,.6,(rnd()-.5)*2,.6,1.2,0x8a7a66,false,.5);crp.push({m:e.m,t:0,tank:e.tank,x:e.x,z:e.z});}
enemies=enemies.filter(e=>e.hp>0);
if(p.hp<=0){S.base-=20;p.hp=100;p.x=0;p.z=12;inJeep=false;}
if(S.base<=0){S.mode='over';msg('העיר נפלה! הגעתם לגל '+S.wave+' · לחצו להתחלה מחדש');}
if(S.mode==='fight'&&spawnLeft==0&&enemies.length==0){S.mode='build';S.coins+=60+S.wave*15;S.nades=3;p.hp=100;if(!jeep.alive){jeep.alive=true;jeep.x=5;jeep.z=12;}jeep.hp=V[jeep.type].hp;msg('גל '+S.wave+' הושלם! הציבו צריחים והתחילו גל הבא');}
pM.visible=!inJeep;pM.position.set(p.x,Math.abs(Math.sin(T*10))*(moving?.08:0),p.z);pM.rotation.y=-a;
if(pM.lL){const s=moving?Math.sin(T*10)*.6:0;pM.lL.rotation.z=s;pM.lR.rotation.z=-s;}
jeepM.visible=jeep.alive;jeepM.position.set(jeep.x,0,jeep.z);if(inJeep)jeepM.rotation.y=-a;}
for(const c of crp){c.t+=dt;if(!c.tank){const k=Math.min(1,c.t/.45);c.m.rotation.z=-k*1.5;c.m.position.y=-k*.15;}else if(c.t<9){if(rnd()<.25)puff(c.x,1.6,c.z,(rnd()-.5)*.5,2.5,(rnd()-.5)*.5,2.2,1.6,0x222222,false,.5);if(rnd()<.08)puff(c.x+(rnd()-.5)*2,1.4,c.z+(rnd()-.5)*2,0,1.5,0,.5,1.2,0xff8a22,true,.9);}if(c.t>(c.tank?9:7)){sc.remove(c.m);c.dead=1;}}
for(let i=crp.length-1;i>=0;i--)if(crp[i].dead)crp.splice(i,1);
for(const q of ps){q.t-=dt;q.m.position.x+=q.vx*dt;q.m.position.y+=q.vy*dt;q.m.position.z+=q.vz*dt;const k=1-q.t/q.life;q.m.scale.setScalar(q.size*(1+k*1.5));q.m.material.opacity=Math.max(0,q.op*(1-k));if(q.t<=0){sc.remove(q.m);q.m.material.dispose();}}
ps=ps.filter(q=>q.t>0);
for(const w of wr)if(rnd()<.12)puff(w.x,1.5,w.z,(rnd()-.5)*.6,2.2,(rnd()-.5)*.6,2.5,1.8,0x303030,false,.4);const hv=inJeep?jeep.hp:p.hp;if(hv<lastHv-.5)hurt=.7;lastHv=hv;hurt=Math.max(0,hurt-dt*1.5);$('hit').style.opacity=hurt;fl.intensity=Math.max(0,fl.intensity-dt*18);mf.intensity=Math.max(0,mf.intensity-dt*40);shake=Math.max(0,shake-dt*2.5);
const sx=(rnd()-.5)*shake,sz=(rnd()-.5)*shake;
cam.position.set(p.x*.9+sx,21,p.z*.9+16+sz);cam.lookAt(p.x*.9,0,p.z*.9);
$('st').textContent='גל '+S.wave+' · מטבעות '+S.coins+' · רימונים '+S.nades+(inJeep?' · '+V[jeep.type].n+' '+Math.max(0,jeep.hp|0):' · חיים '+Math.max(0,p.hp|0))+' · חיי העיר';
$('bf').style.width=Math.max(0,S.base/3)+'%';}
loop();
</script>
