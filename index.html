
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אזור המשחקים 🎮</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101525;
      color: white;
    }
    header {
      text-align: center;
      padding: 38px 16px;
      background: linear-gradient(135deg, #182c55, #492c78);
    }
    header h1 { font-size: 42px; margin: 0 0 12px; }
    header p { color: #d8d9f5; font-size: 18px; }
    main { max-width: 1150px; margin: auto; padding: 25px 18px; }
    .section-title { font-size: 25px; margin: 12px 0 20px; }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 22px;
    }
    .card {
      background: #202b43;
      border: 1px solid #344361;
      border-radius: 17px;
      overflow: hidden;
      box-shadow: 0 8px 22px #0005;
    }
    .cover {
      width: 100%;
      height: 175px;
      object-fit: cover;
      background: linear-gradient(135deg, #2866a5, #8046a8);
      display: block;
    }
    .card-content { padding: 17px; }
    .card h3 { margin: 0 0 15px; font-size: 21px; }
    .actions { display: flex; gap: 9px; flex-wrap: wrap; }
    a {
      display: inline-block;
      text-decoration: none;
      background: #6552d9;
      color: white;
      padding: 11px 15px;
      border-radius: 9px;
      font-weight: bold;
    }
    a:hover { background: #806ff0; }
    .original { background: #35435f; }
    footer {
      text-align: center;
      color: #9da9c4;
      padding: 30px;
    }
    @media (max-width: 500px) {
      header h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🎮 אזור המשחקים</h1>
    <p>עולם של משחקים, אתגרים והרפתקאות!</p>
  </header>

  <main>
    <h2 class="section-title">🕹️ המשחקים שלנו</h2>
    <div class="games">

      <article class="card">
        <img class="cover"
          src="https://placehold.co/600x350/24518a/ffffff?text=Thinking+Games"
          alt="משחקי חשיבה">
        <div class="card-content">
          <h3>🧠 משחקי חשיבה</h3>
          <p>משחקים שמאתגרים את המחשבה</p>
        </div>
      </article>

      <article class="card">
        <img class="cover"
          src="https://placehold.co/600x350/853d65/ffffff?text=Racing"
          alt="משחקי מרוצים">
        <div class="card-content">
          <h3>🏎️ משחקי מרוצים</h3>
          <p>מהירות, תחרות ואקשן</p>
        </div>
      </article>

      <article class="card">
        <img class="cover"
          src="https://placehold.co/600x350/28765c/ffffff?text=Adventure"
          alt="משחקי הרפתקאות">
        <div class="card-content">
          <h3>🗺️ משחקי הרפתקאות</h3>
          <p>יוצאים לגלות עולמות חדשים</p>
        </div>
      </article>

    </div>
  </main>

  <footer>אזור המשחקים © כל הזכויות שמורות</footer>
</body>
</html>
